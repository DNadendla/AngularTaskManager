<!-- bootstrap based login page -->

<!-- refactor above to have login form with one side Labels and other side Tags -->
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header text-center">
          <h3>Login</h3>
        </div>
        <div class="card-body">
          <form (ngSubmit)="onLoginClick()" #loginForm="ngForm">
            <div class="mb-3 row">
              <label for="username" class="col-sm-4 col-form-label"
                >Username</label
              >
              <div class="col-sm-8">
                <input
                  type="text"
                  id="username"
                  class="form-control"
                  required
                  [(ngModel)]="loginViewModel.username"
                  name="username"
                />
              </div>
            </div>
            <div class="mb-3 row">
              <label for="Password" class="col-sm-4 col-form-label"
                >Password</label
              >
              <div class="col-sm-8">
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  required
                  [(ngModel)]="loginViewModel.password"
                  name="password"
                />
              </div>
            </div>
            <div class="mb-3 row">
              <div class="text-center mt-3">
                <!-- error alert (show only when there is an error) -->
                <div
                  *ngIf="loginError"
                  class="alert alert-danger py-1 mb-2"
                  role="alert"
                >
                  {{ loginError }}
                </div>

                <button
                  type="submit"
                  class="btn btn-primary btn-block w-100 d-flex justify-content-center align-items-center gap-2"
                  [disabled]="!loginForm.form.valid"
                >
                  <i class="bi bi-box-arrow-in-right d-none d-sm-inline"></i>
                  <span>Login</span>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
