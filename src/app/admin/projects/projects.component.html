<!-- HTML code to filter data by projectName,dateOfStart,teamSize + a Search text-->
<div class="row g-2 mb-3 mt-3 align-items-center">
  <div class="col">
    <select
      class="form-select form-select-sm"
      [(ngModel)]="searchBy"
      name="searchBy"
      required
    >
      <option value="" disabled selected>Please Select</option>
      <option value="projectName">Name</option>
      <option value="dateOfStart">Start Date</option>
      <option value="teamSize">Team Size</option>
    </select>
  </div>

  <div class="col">
    <input
      class="form-control form-control-sm"
      type="text"
      placeholder="Search..."
      [(ngModel)]="searchText"
      (input)="onSearchProjects()"
      name="searchText"
      [disabled]="!searchBy"
    />
  </div>

  <!-- <div class="col-auto">
    <button class="btn btn-sm btn-outline-secondary" (click)="searchText = ''">
      Clear
    </button>
  </div> -->
</div>

<!-- Add Project Button -->
<button class="btn btn-primary mb-2 mt-2" (click)="openAddModal()">
  Add Project
</button>

      <th>ID</th>
      <th>Name</th>
      <th>Start Date</th>
      <th>Team Size</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let project of projects; let i = index">
      <td>{{ project.projectID }}</td>
      <td>{{ project.projectName }}</td>
      <td>{{ project.dateOfStart | date : "mediumDate" }}</td>
      <td>{{ project.teamSize }}</td>
      <td>
        <div class="d-flex justify-content-right gap-2">
          <button class="btn btn-sm btn-warning" (click)="openEditModal(i)">
            Edit
          </button>
          <button class="btn btn-sm btn-danger" (click)="openDeleteModal(i)">
            Delete
          </button>
        </div>
      </td>

<!-- Add Modal -->
<div #addProjectModal class="modal fade" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Project</h5>
        <button
          type="button"
          class="btn-close"
          (click)="addModal.hide()"
        ></button>
      </div>
      <div class="modal-body">
        <form>
          <input
            type="number"
            placeholder="ID"
            [(ngModel)]="project.projectID"
            name="id"
            class="form-control mb-2"
          />
          <input
            type="text"
            placeholder="Name"
            [(ngModel)]="project.projectName"
            name="name"
            class="form-control mb-2"
          />
          <input
            type="date"
            placeholder="Start Date"
            [(ngModel)]="project.dateOfStart"
            name="date"
            class="form-control mb-2"
          />
          <input
            type="number"
            placeholder="Team Size"
            [(ngModel)]="project.teamSize"
            name="size"
            class="form-control mb-2"
          />
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" (click)="saveProject()">Save</button>
        <button class="btn btn-secondary" (click)="addModal.hide()">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div #editProjectModal class="modal fade" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Project</h5>
        <button
          type="button"
          class="btn-close"
          (click)="editModal.hide()"
        ></button>
      </div>
      <div class="modal-body">
        <form>
          <input
            type="number"
            placeholder="ID"
            [(ngModel)]="editProject.projectID"
            name="id"
            class="form-control mb-2"
          />
          <input
            type="text"
            placeholder="Name"
            [(ngModel)]="editProject.projectName"
            name="name"
            class="form-control mb-2"
          />
          <input
            type="date"
            placeholder="Start Date"
            [(ngModel)]="editProject.dateOfStart"
            name="date"
            class="form-control mb-2"
          />
          <input
            type="number"
            placeholder="Team Size"
            [(ngModel)]="editProject.teamSize"
            name="size"
            class="form-control mb-2"
          />
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" (click)="updateProject()">
          Update
        </button>
        <button class="btn btn-secondary" (click)="editModal.hide()">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div #deleteProjectModal class="modal fade" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button
          type="button"
          class="btn-close"
          (click)="deleteModal.hide()"
        ></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete project "{{
          deleteProject.projectName
        }}"?
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" (click)="deleteProjectConfirm()">
          Delete
        </button>
        <button class="btn btn-secondary" (click)="deleteModal.hide()">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
